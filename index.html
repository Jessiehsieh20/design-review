<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>內部平面設計審核評分表</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e3e6eb;
    --text: #1f2937;
    --muted: #6b7280;
    --self: #2563eb;
    --self-light: #dbeafe;
    --self-tint: #eff6ff;
    --sup: #16a34a;
    --sup-light: #dcfce7;
    --sup-tint: #f0fdf4;
    --warn: #f59e0b;
    --bad: #dc2626;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 24px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }
  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static !important; }
  }
  header.page-header {
    grid-column: 1 / -1;
    margin-bottom: 4px;
  }
  header.page-header h1 {
    font-size: 24px;
    margin: 0 0 6px;
    letter-spacing: 0.5px;
  }
  header.page-header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .toolbar {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: #f3f4f6; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-primary {
    background: var(--self);
    border-color: var(--self);
    color: #fff;
  }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-block { width: 100%; margin-top: 14px; }
  .input {
    border: 1px solid var(--border);
    background: var(--card);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    min-width: 240px;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input:focus {
    outline: none;
    border-color: var(--self);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  .input.invalid {
    border-color: var(--bad);
    background: #fef2f2;
  }
  .input.invalid:focus {
    box-shadow: 0 0 0 3px rgba(220,38,38,0.15);
  }
  .required-mark {
    color: var(--bad);
    margin-left: 2px;
  }

  .category {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .category-header {
    padding: 14px 18px;
    background: linear-gradient(180deg, #fafbfc, #f4f6f8);
    border-bottom: 1px solid var(--border);
  }
  .category-title-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .category-title {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  .category-meta {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }
  .category-scores {
    margin-left: auto;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    display: flex;
    gap: 12px;
  }
  .category-scores .self-s { color: var(--self); font-weight: 600; }
  .category-scores .sup-s { color: var(--sup); font-weight: 600; }
  .col-headers {
    display: grid;
    grid-template-columns: 54px 54px 1fr 52px;
    align-items: center;
    gap: 12px;
    padding: 8px 18px;
    background: #fafbfc;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .col-headers .col-self { color: var(--self); text-align: center; }
  .col-headers .col-sup { color: var(--sup); text-align: center; }
  .col-headers .col-score { text-align: right; }
  .item {
    display: grid;
    grid-template-columns: 54px 54px 1fr 52px;
    align-items: center;
    gap: 12px;
    padding: 11px 18px;
    border-top: 1px solid #f1f3f5;
    cursor: default;
    transition: background 0.1s;
    position: relative;
  }
  .item:first-of-type { border-top: 0; }
  .item .cb-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .item .cb-wrap input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    margin: 0;
  }
  .item .self-check { accent-color: var(--self); }
  .item .sup-check { accent-color: var(--sup); }
  .item .self-cell {
    background: var(--self-tint);
    border-radius: 6px;
    padding: 4px 0;
  }
  .item .sup-cell {
    background: var(--sup-tint);
    border-radius: 6px;
    padding: 4px 0;
  }
  .item-label {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
  }
  .item-score {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 13px;
  }
  .item.flag-incomplete {
    background: #fff7ed;
    box-shadow: inset 3px 0 0 var(--warn);
  }
  .item.flag-incomplete .item-label {
    color: var(--text);
    font-weight: 500;
  }
  .item.flag-incomplete .item-score {
    color: #d97706;
    font-weight: 600;
  }
  .item.flag-passed .item-label {
    color: #b6bcc4;
    text-decoration: line-through;
    text-decoration-color: #d1d5db;
  }
  .item.flag-passed .item-score {
    color: #c7cbd1;
  }
  .item.flag-disagree {
    background: #fef2f2;
    box-shadow: inset 3px 0 0 var(--bad);
  }
  .item.flag-disagree .item-label {
    color: var(--text);
    font-weight: 500;
  }
  .item.flag-disagree .item-score {
    color: var(--bad);
    font-weight: 600;
  }

  .sidebar {
    position: sticky;
    top: 20px;
    align-self: start;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .score-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .dual-score {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .score-block {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 12px;
    text-align: center;
  }
  .score-block.self { background: var(--self-tint); border-color: var(--self-light); }
  .score-block.sup { background: var(--sup-tint); border-color: var(--sup-light); }
  .score-label {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 4px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .score-block.self .score-label { color: var(--self); }
  .score-block.sup .score-label { color: var(--sup); }
  .score-value {
    font-size: 38px;
    font-weight: 700;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }
  .score-block.self .score-value { color: var(--self); }
  .score-block.sup .score-value { color: var(--sup); }
  .score-suffix {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .grade-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 8px;
    background: #e5e7eb;
    color: var(--muted);
  }
  .grade-desc {
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
    min-height: 14px;
  }
  .info-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }
  .info-card strong { color: var(--text); display: block; margin-bottom: 4px; font-size: 13px; }
  .info-card .row { display: flex; justify-content: space-between; gap: 8px; }
  .info-card .row .label { color: var(--text); white-space: nowrap; }

  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 12px 22px;
    background: #1f2937;
    color: #fff;
    border-radius: 10px;
    font-size: 14px;
    z-index: 1000;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error { background: var(--bad); }
  .toast.success { background: var(--sup); }
</style>
</head>
<body>
<div class="layout">
  <header class="page-header">
    <h1>內部平面設計審核評分表</h1>
    <p>每項勾選即累計分數。請組員自評後產生覆核連結傳給主管，主管在原連結上覆核（預設與自評同步，僅取消不認同的項目即可）。</p>
  </header>

  <div class="toolbar">
    <input id="projectName" class="input" placeholder="素材名稱（必填）" required>
    <button class="btn" id="checkAll">全部勾選</button>
    <button class="btn" id="uncheckAll">全部取消</button>
    <button class="btn btn-primary" id="shareBtn">產生覆核連結</button>
  </div>

  <main id="categories"></main>

  <aside class="sidebar">
    <div class="score-card">
      <div class="dual-score">
        <div class="score-block self">
          <div class="score-label">組員自評</div>
          <div class="score-value" id="selfScore">0</div>
          <span class="score-suffix">/ 100 分</span>
          <div><span class="grade-badge" id="selfGrade">—</span></div>
          <div class="grade-desc" id="selfDesc">尚未開始</div>
        </div>
        <div class="score-block sup">
          <div class="score-label">主管覆核</div>
          <div class="score-value" id="supScore">0</div>
          <span class="score-suffix">/ 100 分</span>
          <div><span class="grade-badge" id="supGrade">—</span></div>
          <div class="grade-desc" id="supDesc">尚未覆核</div>
        </div>
      </div>
      <button class="btn btn-block" id="exportImageBtn">下載結果為圖檔</button>
    </div>

    <div class="info-card">
      <strong>等級判定</strong>
      <div class="row"><span class="label">90–100</span><span>優：可直接交付</span></div>
      <div class="row"><span class="label">75–89</span><span>良：小幅修改</span></div>
      <div class="row"><span class="label">60–74</span><span>普：中度修改</span></div>
      <div class="row"><span class="label">&lt; 60</span><span>不佳：退件重做</span></div>
    </div>
  </aside>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
<script>
const data = [
  {
    title: "一、版面結構與視覺動線",
    desc: "確認版面安排讓讀者看得順、看得舒服，能馬上掌握重點",
    items: [
      ["資訊層級是否分明（標題 > 副標 > 內文 > 註解）", 5],
      ["閱讀動線是否順暢（Z 字型／F 字型）", 5],
      ["相鄰資訊是否清晰分組（同組靠近、異組分開）", 3],
      ["資訊密度是否平均（沒有某區塞滿、某區空蕩）", 3],
      ["留白是否足夠（版面不擁擠、不壓迫）", 3],
      ["排版是否對齊（至少 3 個元素共用對齊線）", 3],
      ["CTA 是否足夠清楚（顏色、大小、留白突出）", 3],
    ],
  },
  {
    title: "二、版面設計感與目的性",
    desc: "確認版面看起來有設計過，且合乎主題（避免亂塞、填空式設計）",
    items: [
      ["版面是否能畫出明確的區塊結構邏輯（例：主標區、內文區、主視覺區…等）", 3],
      ["每個 ICON／裝飾元素是否都有功能性理由", 5],
      ["同類元素是否有一致性處理（例：同一版面的卡片、區塊小標題、ICON，大小、配色、風格一致）", 5],
      ["是否有明確的主角區與配角區（版面有節奏與層次）", 3],
      ["背景是否克制（無過多紋理、光暈、漸層搶走主視覺）", 3],
      ["是否避免過度框線／色塊（不要每個區塊都被框起來）", 3],
    ],
  },
  {
    title: "三、主視覺與素材",
    desc: "確認視覺元素運用適當，且有一致性",
    items: [
      ["主視覺元素是否有足夠份量（或有重複視覺元素作為主視覺）", 5],
      ["素材選用是否合乎主題（是否能在 3 秒內傳達核心訊息或呈現主題意象）", 5],
      ["素材風格是否符合品牌／主題調性", 5],
      ["ICON、插圖風格是否一致（無扁平／手繪混用、外框粗細一致）", 5],
      ["圖片解析度／品質是否足夠（不模糊、不變形）", 3],
      ["圖片裁切是否合理（人物頭部、重要元素未被切到）", 2],
    ],
  },
  {
    title: "四、色彩與文字設計",
    desc: "確認色彩、字體運用適當",
    items: [
      ["色調是否符合品牌／主題調性", 3],
      ["主色、輔色、強調色是否和諧（建議比例 6:3:1）", 3],
      ["色彩數量是否克制（主+輔+強調 ≤ 5 色）", 3],
      ["字體選擇是否符合品牌／主題調性", 2],
      ["文字與背景對比度是否足夠（可讀性）", 2],
      ["強調色是否真的有強調效果（沒有被濫用）", 2],
    ],
  },
  {
    title: "五、文字內容品質",
    desc: "確認資訊的正確性，且能精準傳達",
    items: [
      ["文案長度是否適合", 2],
      ["是否有重複性、多餘的文字或句子", 2],
      ["文字資訊正確且無錯字", 5],
      ["CTA 文案是否具體（例如：「立即報名」優於「了解更多」）", 2],
      ["數字、英文與中文之間是否有盤古之白", 2],
    ],
  },
];

const root = document.getElementById("categories");
data.forEach((cat, ci) => {
  const catEl = document.createElement("section");
  catEl.className = "category";
  const catMax = cat.items.reduce((s, [, p]) => s + p, 0);
  catEl.innerHTML = `
    <div class="category-header">
      <div class="category-title-row">
        <h2 class="category-title">${cat.title}</h2>
        <div class="category-scores">
          <span><span class="self-s" data-cat-self="${ci}">0</span> <span style="color:#9ca3af">/ ${catMax}</span></span>
          <span style="color:#cbd5e1">·</span>
          <span><span class="sup-s" data-cat-sup="${ci}">0</span> <span style="color:#9ca3af">/ ${catMax}</span></span>
        </div>
      </div>
      <div class="category-meta">${cat.desc}</div>
    </div>
    <div class="col-headers">
      <span class="col-self">自評</span>
      <span class="col-sup">覆核</span>
      <span>檢查項目</span>
      <span class="col-score">分數</span>
    </div>
  `;
  cat.items.forEach(([label, score], ii) => {
    const selfId = `self_${ci}_${ii}`;
    const supId = `sup_${ci}_${ii}`;
    const row = document.createElement("div");
    row.className = "item";
    row.dataset.cat = ci;
    row.dataset.idx = ii;
    row.innerHTML = `
      <label class="cb-wrap self-cell" for="${selfId}">
        <input type="checkbox" id="${selfId}" class="self-check" data-cat="${ci}" data-idx="${ii}" data-score="${score}">
      </label>
      <label class="cb-wrap sup-cell" for="${supId}">
        <input type="checkbox" id="${supId}" class="sup-check" data-cat="${ci}" data-idx="${ii}" data-score="${score}">
      </label>
      <span class="item-label">${label}</span>
      <span class="item-score">+${score}</span>
    `;
    catEl.appendChild(row);
  });
  root.appendChild(catEl);
});

function gradeOf(score) {
  if (score >= 90) return { label: "優", desc: "可直接交付", color: "#16a34a", bg: "#dcfce7" };
  if (score >= 75) return { label: "良", desc: "小幅修改即可交付", color: "#2563eb", bg: "#dbeafe" };
  if (score >= 60) return { label: "普", desc: "中度修改，需局部大修", color: "#f59e0b", bg: "#fef3c7" };
  return { label: "不佳", desc: "整體退件重做", color: "#dc2626", bg: "#fee2e2" };
}

function recalc() {
  let selfTotal = 0, supTotal = 0;
  const catSelf = data.map(() => 0);
  const catSup = data.map(() => 0);
  data.forEach((cat, ci) => {
    cat.items.forEach((it, ii) => {
      const self = document.getElementById(`self_${ci}_${ii}`).checked;
      const sup = document.getElementById(`sup_${ci}_${ii}`).checked;
      if (self) { selfTotal += it[1]; catSelf[ci] += it[1]; }
      if (sup) { supTotal += it[1]; catSup[ci] += it[1]; }
      const row = document.querySelector(`.item[data-cat="${ci}"][data-idx="${ii}"]`);
      row.classList.remove("flag-incomplete", "flag-passed", "flag-disagree");
      if (self && sup) row.classList.add("flag-passed");
      else if (self && !sup) row.classList.add("flag-disagree");
      else row.classList.add("flag-incomplete");
    });
  });
  document.getElementById("selfScore").textContent = selfTotal;
  document.getElementById("supScore").textContent = supTotal;
  applyGrade("selfScore", "selfGrade", "selfDesc", selfTotal, "尚未開始");
  applyGrade("supScore", "supGrade", "supDesc", supTotal, "尚未覆核");
  document.querySelectorAll("[data-cat-self]").forEach(el => {
    el.textContent = catSelf[+el.dataset.catSelf];
  });
  document.querySelectorAll("[data-cat-sup]").forEach(el => {
    el.textContent = catSup[+el.dataset.catSup];
  });
  save();
}

function applyGrade(scoreId, gradeId, descId, score, emptyDesc) {
  const g = gradeOf(score);
  const badge = document.getElementById(gradeId);
  const desc = document.getElementById(descId);
  if (score === 0) {
    badge.textContent = "—";
    badge.style.background = "#e5e7eb";
    badge.style.color = "var(--muted)";
    desc.textContent = emptyDesc;
  } else {
    badge.textContent = g.label;
    badge.style.background = g.bg;
    badge.style.color = g.color;
    desc.textContent = g.desc;
  }
}

document.addEventListener("change", e => {
  if (e.target.classList.contains("self-check")) {
    const ci = e.target.dataset.cat;
    const ii = e.target.dataset.idx;
    document.getElementById(`sup_${ci}_${ii}`).checked = e.target.checked;
    recalc();
  } else if (e.target.classList.contains("sup-check")) {
    recalc();
  }
});

document.getElementById("checkAll").addEventListener("click", () => {
  document.querySelectorAll(".self-check").forEach(cb => cb.checked = true);
  document.querySelectorAll(".sup-check").forEach(cb => cb.checked = true);
  recalc();
});
document.getElementById("uncheckAll").addEventListener("click", () => {
  document.querySelectorAll(".self-check").forEach(cb => cb.checked = false);
  document.querySelectorAll(".sup-check").forEach(cb => cb.checked = false);
  recalc();
});

document.getElementById("projectName").addEventListener("input", () => {
  document.getElementById("projectName").classList.remove("invalid");
  save();
});

const STORAGE_KEY = "design-review-state-v3";
function save() {
  const state = {
    project: document.getElementById("projectName").value,
    self: getBits("self-check"),
    sup: getBits("sup-check"),
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
function getBits(cls) {
  return Array.from(document.querySelectorAll("." + cls)).map(cb => cb.checked ? "1" : "0").join("");
}
function setBits(cls, bits) {
  const cbs = document.querySelectorAll("." + cls);
  cbs.forEach((cb, i) => { cb.checked = bits[i] === "1"; });
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const state = JSON.parse(raw);
    if (state.project) document.getElementById("projectName").value = state.project;
    if (state.self) setBits("self-check", state.self);
    if (state.sup) setBits("sup-check", state.sup);
  } catch (e) {}
}
function loadFromURL() {
  const params = new URLSearchParams(location.search);
  if (!params.has("p") && !params.has("s")) return false;
  if (params.has("p")) document.getElementById("projectName").value = params.get("p");
  if (params.has("s")) setBits("self-check", params.get("s"));
  if (params.has("v")) setBits("sup-check", params.get("v"));
  return true;
}

function validateProject(actionName) {
  const input = document.getElementById("projectName");
  if (!input.value.trim()) {
    input.classList.add("invalid");
    input.focus();
    showToast(`請先填寫素材名稱才能${actionName}`, "error");
    return false;
  }
  input.classList.remove("invalid");
  return true;
}

function showToast(msg, type) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (type ? " " + type : "");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { el.className = "toast"; }, 2600);
}

document.getElementById("shareBtn").addEventListener("click", async () => {
  if (!validateProject("產生覆核連結")) return;
  const params = new URLSearchParams();
  params.set("p", document.getElementById("projectName").value.trim());
  params.set("s", getBits("self-check"));
  params.set("v", getBits("sup-check"));
  const url = `${location.origin}${location.pathname}?${params.toString()}`;
  try {
    await navigator.clipboard.writeText(url);
    showToast("已複製覆核連結到剪貼簿，傳給主管即可", "success");
  } catch (e) {
    prompt("複製這個連結傳給主管：", url);
  }
});

function buildExportSnapshot() {
  const project = document.getElementById("projectName").value.trim() || "未命名素材";
  const selfTotal = +document.getElementById("selfScore").textContent;
  const supTotal = +document.getElementById("supScore").textContent;
  const selfG = gradeOf(selfTotal);
  const supG = gradeOf(supTotal);
  const date = new Date().toLocaleDateString("zh-TW");

  const wrapper = document.createElement("div");
  wrapper.style.cssText = [
    "width:920px",
    "padding:28px",
    "background:#f5f6f8",
    'font-family:-apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", Arial, sans-serif',
    "color:#1f2937",
    "box-sizing:border-box",
  ].join(";");

  const checkBox = (checked, color) => checked
    ? `<span style="display:inline-block;width:16px;height:16px;background:${color};border:1.5px solid ${color};border-radius:3px;color:#fff;font-size:11px;line-height:14px;text-align:center;">&#10003;</span>`
    : `<span style="display:inline-block;width:16px;height:16px;background:#fff;border:1.5px solid #cbd5e1;border-radius:3px;"></span>`;

  const catsHtml = data.map((cat, ci) => {
    const rows = cat.items.map((it, ii) => {
      const self = document.getElementById(`self_${ci}_${ii}`).checked;
      const sup = document.getElementById(`sup_${ci}_${ii}`).checked;
      let rowStyle = "";
      let labelStyle = "color:#1f2937;font-weight:500;";
      let scoreColor = "#9ca3af";
      let scoreWeight = "400";
      if (self && sup) {
        labelStyle = "color:#9ca3af;text-decoration:line-through;";
        scoreColor = "#cbd5e1";
      } else if (self && !sup) {
        rowStyle = "background:#fef2f2;box-shadow:inset 3px 0 0 #dc2626;";
        scoreColor = "#dc2626"; scoreWeight = "600";
      } else {
        rowStyle = "background:#fff7ed;box-shadow:inset 3px 0 0 #f59e0b;";
        scoreColor = "#d97706"; scoreWeight = "600";
      }
      return `<div style="display:grid;grid-template-columns:48px 48px 1fr 48px;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid #f1f3f5;${rowStyle}">
        <span style="text-align:center;">${checkBox(self, "#2563eb")}</span>
        <span style="text-align:center;">${checkBox(sup, "#16a34a")}</span>
        <span style="font-size:13px;line-height:1.5;${labelStyle}">${it[0]}</span>
        <span style="text-align:right;font-size:12px;color:${scoreColor};font-variant-numeric:tabular-nums;font-weight:${scoreWeight};">+${it[1]}</span>
      </div>`;
    }).join("");
    const catSelf = cat.items.reduce((s, it, ii) => s + (document.getElementById(`self_${ci}_${ii}`).checked ? it[1] : 0), 0);
    const catSup = cat.items.reduce((s, it, ii) => s + (document.getElementById(`sup_${ci}_${ii}`).checked ? it[1] : 0), 0);
    const catMax = cat.items.reduce((s, [, p]) => s + p, 0);
    return `<div style="background:#fff;border:1px solid #e3e6eb;border-radius:12px;margin-bottom:14px;overflow:hidden;">
      <div style="padding:12px 16px;background:#fafbfc;border-bottom:1px solid #e3e6eb;display:flex;justify-content:space-between;align-items:baseline;">
        <h3 style="margin:0;font-size:15px;color:#1f2937;">${cat.title}</h3>
        <span style="font-size:13px;font-variant-numeric:tabular-nums;">
          <span style="color:#2563eb;font-weight:600;">${catSelf}</span><span style="color:#9ca3af;"> / ${catMax}</span>
          <span style="color:#cbd5e1;margin:0 4px;">·</span>
          <span style="color:#16a34a;font-weight:600;">${catSup}</span><span style="color:#9ca3af;"> / ${catMax}</span>
        </span>
      </div>
      <div style="display:grid;grid-template-columns:48px 48px 1fr 48px;align-items:center;gap:10px;padding:6px 14px;background:#fafbfc;border-bottom:1px solid #e3e6eb;font-size:10px;color:#6b7280;font-weight:600;">
        <span style="text-align:center;color:#2563eb;">自評</span>
        <span style="text-align:center;color:#16a34a;">覆核</span>
        <span>檢查項目</span>
        <span style="text-align:right;">分數</span>
      </div>
      ${rows}
    </div>`;
  }).join("");

  wrapper.innerHTML = `
    <div style="background:#fff;border:1px solid #e3e6eb;border-radius:12px;padding:20px 24px;margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:24px;">
        <div>
          <div style="font-size:12px;color:#6b7280;margin-bottom:4px;">${date}</div>
          <h1 style="font-size:22px;margin:0;color:#1f2937;">${project}</h1>
          <div style="font-size:13px;color:#6b7280;margin-top:4px;">內部平面設計審核評分表</div>
        </div>
        <div style="display:flex;gap:12px;">
          <div style="background:#eff6ff;border:1px solid #dbeafe;border-radius:10px;padding:10px 16px;min-width:130px;text-align:center;">
            <div style="font-size:11px;color:#2563eb;font-weight:600;letter-spacing:0.5px;">組員自評</div>
            <div style="font-size:30px;font-weight:700;color:#2563eb;line-height:1.1;font-variant-numeric:tabular-nums;">${selfTotal}<span style="font-size:13px;color:#9ca3af;font-weight:400;"> / 100</span></div>
            <div style="display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;background:${selfG.bg};color:${selfG.color};font-size:11px;font-weight:600;">${selfG.label}</div>
          </div>
          <div style="background:#f0fdf4;border:1px solid #dcfce7;border-radius:10px;padding:10px 16px;min-width:130px;text-align:center;">
            <div style="font-size:11px;color:#16a34a;font-weight:600;letter-spacing:0.5px;">主管覆核</div>
            <div style="font-size:30px;font-weight:700;color:#16a34a;line-height:1.1;font-variant-numeric:tabular-nums;">${supTotal}<span style="font-size:13px;color:#9ca3af;font-weight:400;"> / 100</span></div>
            <div style="display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;background:${supG.bg};color:${supG.color};font-size:11px;font-weight:600;">${supG.label}</div>
          </div>
        </div>
      </div>
    </div>
    ${catsHtml}
  `;
  return wrapper;
}

document.getElementById("exportImageBtn").addEventListener("click", async () => {
  if (!validateProject("下載結果為圖檔")) return;
  const btn = document.getElementById("exportImageBtn");
  const original = btn.textContent;
  btn.textContent = "產生圖片中…";
  btn.disabled = true;
  let hider = null;
  try {
    if (typeof htmlToImage === "undefined") {
      alert("圖片產生器尚未載入（可能網路較慢或被擋），請重新整理頁面後再試。");
      return;
    }
    const project = document.getElementById("projectName").value.trim();
    const supTotal = document.getElementById("supScore").textContent;
    const snapshot = buildExportSnapshot();
    hider = document.createElement("div");
    hider.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;overflow:hidden;pointer-events:none;z-index:-9999;";
    hider.appendChild(snapshot);
    document.body.appendChild(hider);
    await new Promise(r => setTimeout(r, 150));
    const dataUrl = await htmlToImage.toPng(snapshot, {
      backgroundColor: "#f5f6f8",
      pixelRatio: 2,
      cacheBust: true,
      width: 920,
      height: snapshot.scrollHeight,
    });
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = `設計評分_${project}_${supTotal}分.png`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    showToast("圖檔已下載", "success");
  } catch (e) {
    console.error(e);
    alert("產生圖片失敗：" + (e && e.message ? e.message : e));
  } finally {
    if (hider && hider.parentNode) hider.parentNode.removeChild(hider);
    btn.textContent = original;
    btn.disabled = false;
  }
});

if (!loadFromURL()) loadLocal();
recalc();
</script>
